<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/static/style.css">
  <title>Settings - xOS</title>
</head>
<body>
  <header>
    <div><strong>xOs<span style="color:var(--primary)">Settings</span></strong></div>
    <a href="/" class="btn" style="background:#444;">🏠 Home</a>
  </header>
  
  <div class="container">
    <div class="card">
      <h3>📁 Directory Principale</h3>
      <form method="post">
        <input type="text" name="main_dir" value="{{ current_dir }}">
        <input type="submit" value="Aggiorna" style="background:#28a745;">
      </form>
    </div>

    <div class="card">
      <h3>👥 Utenti</h3>
      {% for u, p in users.items() %}
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; background:rgba(0,0,0,0.2); padding:10px; border-radius:10px;">
          <span>👤 {{ u }} ({{ p }})</span>
          <form method="post" onsubmit="return confirm('Eliminare?');">
            <input type="hidden" name="delete_user" value="{{ u }}">
            <input type="submit" value="Elimina" style="background:#dc3545; width:auto; padding:5px 10px;">
          </form>
        </div>
      {% endfor %}
      <hr>
      <form method="post">
        <input type="text" name="username" placeholder="Nuovo o esistente">
        <input type="password" name="password" placeholder="Password">
        <input type="submit" value="Salva / Aggiorna Password">
      </form>
    </div>

    <div class="card">
      <h3>📜 Registro Attività</h3>
      <div style="background:#000; color:#00ff9f; padding:15px; height:300px; overflow-y:auto; font-family:monospace; font-size:0.8rem; border-radius:10px;">
        {% for log in logs|reverse %}
          <div style="border-bottom:1px solid #222; padding:3px 0;">{{ log }}</div>
        {% endfor %}
      </div>
    </div>
  </div>
</body>
</html>
